name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Tcl for generated workload tests
        run: |
          if ! command -v tclsh >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq tcl
          fi
      - name: Run offline tests
        run: python -m unittest -q
